name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every test file
        run: |
          failed=0
          for f in test/*.test.js; do
            echo "::group::$f"
            node "$f" || { echo "::error file=$f::failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed